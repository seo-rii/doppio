name: Pages

on:
  push:
    branches:
      - modern
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Pages workflow settings
        run: node ci/check_pages_workflow.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: |
          npm install -g yarn@1.22.22
          TRAVIS=true yarn install --frozen-lockfile --ignore-engines

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build Pages artifact
        run: ./ci/build_pages.sh

      - name: Run local browser playground smoke
        run: ./ci/run_pages_browser_smoke.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: '600000'
          reporting_interval: '10000'

  browser-smoke:
    name: Browser smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: |
          npm install -g yarn@1.22.22
          TRAVIS=true yarn install --frozen-lockfile --ignore-engines

      - name: Run browser playground smoke
        env:
          DOPPIO_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: yarn site:browser-test
