name: Modern Java

on:
  push:
  pull_request:

concurrency:
  group: modern-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Modern Java compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          npm install -g yarn@1.22.22
          TRAVIS=true yarn install --frozen-lockfile --ignore-engines --network-timeout 600000

      - name: Check TypeScript compiler compatibility
        run: |
          ./node_modules/.bin/grunt bootstrap-typecheck --grunt-ignore-compile-errors
          yarn typecheck
          yarn typecheck:bootstrap
          yarn typecheck:typescript-7-rc
          yarn typecheck:typescript-7-rc-bootstrap

      - name: Build release browser bundle
        run: ./node_modules/.bin/grunt --stack release --grunt-ignore-compile-errors

      - name: Run modern Java compatibility tests
        run: ./node_modules/.bin/grunt --stack test-modern-java --grunt-ignore-compile-errors

      - name: Run core array compatibility smoke
        run: node build/release-cli/console/test_runner.js classes/test/ArrayOps --makefile

      - name: Cache Kotlin compiler
        uses: actions/cache@v5
        with:
          path: build/kotlin-smoke-cache
          key: kotlin-compiler-2.4.0

      - name: Run Kotlin diagnostic smoke
        run: ./ci/kotlin_diagnostic_smoke.sh

      - name: Run Kotlin bytecode smoke
        run: ./ci/kotlin_bytecode_smoke.sh

      - name: Run Kotlin bytecode runtime smoke
        run: ./ci/kotlin_bytecode_runtime_smoke.sh

      - name: Run Kotlin read-only delegate smoke
        run: ./ci/kotlin_readonly_delegate_smoke.sh

      - name: Run Kotlin basic construct smoke
        run: ./ci/kotlin_basic_construct_smoke.sh

      - name: Run Kotlin advanced construct smoke
        run: ./ci/kotlin_advanced_construct_smoke.sh

      - name: Run Kotlin local interop smoke
        run: ./ci/kotlin_local_interop_smoke.sh

      - name: Run Kotlin record smoke
        run: ./ci/kotlin_record_smoke.sh

      - name: Run Kotlin compiler smoke
        env:
          KOTLIN_SMOKE_CLASSPATH_MODE: full
        run: ./ci/kotlin_smoke.sh

      - name: Run Kotlin I/O smoke
        run: ./ci/kotlin_io_smoke.sh

      - name: Run Kotlin suspend smoke
        run: ./ci/kotlin_suspend_smoke.sh

      - name: Run Kotlin suspend control-flow smoke
        run: ./ci/kotlin_suspend_control_smoke.sh

      - name: Run Kotlin MethodHandles smoke
        run: ./ci/kotlin_methodhandle_smoke.sh

      - name: Run Kotlin coroutine smoke
        run: ./ci/kotlin_coroutine_smoke.sh

      - name: Run Kotlin reflect smoke
        run: ./ci/kotlin_reflect_smoke.sh

      - name: Run Kotlin reflection shape smoke
        run: ./ci/kotlin_reflection_shape_smoke.sh

      - name: Run Kotlin unsigned smoke
        run: ./ci/kotlin_unsigned_smoke.sh

      - name: Run Kotlin CompletableFuture smoke
        run: ./ci/kotlin_completable_future_smoke.sh

      - name: Run Kotlin contract smoke
        run: ./ci/kotlin_contract_smoke.sh

      - name: Run Kotlin enum smoke
        run: ./ci/kotlin_enum_smoke.sh

      - name: Run Kotlin proxy smoke
        run: ./ci/kotlin_proxy_smoke.sh

      - name: Run Kotlin modern Java interop smoke
        run: ./ci/kotlin_modern_java_interop_smoke.sh

      - name: Run Kotlin concurrency smoke
        run: ./ci/kotlin_concurrency_smoke.sh

      - name: Run Kotlin duration smoke
        run: ./ci/kotlin_duration_smoke.sh

      - name: Run Kotlin text/regex smoke
        run: ./ci/kotlin_text_regex_smoke.sh

      - name: Run Kotlin Result/exception smoke
        run: ./ci/kotlin_result_exception_smoke.sh

      - name: Run Kotlin annotation metadata smoke
        run: ./ci/kotlin_annotation_metadata_smoke.sh

      - name: Run Kotlin annotation reflection smoke
        run: ./ci/kotlin_annotation_reflection_smoke.sh

      - name: Run Kotlin modern construct smoke
        run: ./ci/kotlin_modern_construct_smoke.sh

      - name: Run Kotlin capture shape smoke
        run: ./ci/kotlin_capture_shape_smoke.sh

      - name: Run Kotlin default/synthetic smoke
        run: ./ci/kotlin_default_synthetic_smoke.sh

      - name: Run Kotlin when-mapping smoke
        run: ./ci/kotlin_when_mapping_smoke.sh

      - name: Run Kotlin value-class smoke
        run: ./ci/kotlin_value_class_smoke.sh

      - name: Run Kotlin reified/array smoke
        run: ./ci/kotlin_reified_array_smoke.sh

      - name: Run Kotlin JVM interop smoke
        run: ./ci/kotlin_jvm_interop_smoke.sh

      - name: Run Kotlin mutable delegate smoke
        run: ./ci/kotlin_mutable_delegate_smoke.sh

      - name: Run Kotlin reference/sequence smoke
        run: ./ci/kotlin_reference_sequence_smoke.sh

      - name: Run Kotlin inline-control smoke
        run: ./ci/kotlin_inline_control_smoke.sh

      - name: Run Kotlin delegation bridge smoke
        run: ./ci/kotlin_delegation_bridge_smoke.sh

      - name: Run Kotlin extension variance smoke
        run: ./ci/kotlin_extension_variance_smoke.sh

      - name: Run Kotlin receiver-lambda smoke
        run: ./ci/kotlin_receiver_lambda_smoke.sh

      - name: Run Kotlin control-flow smoke
        run: ./ci/kotlin_control_flow_smoke.sh

      - name: Run Kotlin initialization/delegate smoke
        run: ./ci/kotlin_initialization_delegate_smoke.sh

      - name: Run Kotlin collection-builder smoke
        run: ./ci/kotlin_collection_builder_smoke.sh

      - name: Run Kotlin sequence-builder smoke
        run: ./ci/kotlin_sequence_builder_smoke.sh

      - name: Cache Scala compiler
        uses: actions/cache@v5
        with:
          path: build/scala-smoke-cache
          key: scala-compiler-2.13.18

      - name: Run Scala diagnostic smoke
        run: ./ci/scala_diagnostic_smoke.sh

      - name: Run Scala record smoke
        run: ./ci/scala_record_smoke.sh

      - name: Run Scala MethodHandles smoke
        run: ./ci/scala_methodhandle_smoke.sh

      - name: Run Scala I/O smoke
        run: ./ci/scala_io_smoke.sh

      - name: Run Scala NIO smoke
        run: ./ci/scala_nio_smoke.sh

      - name: Run Scala proxy smoke
        run: ./ci/scala_proxy_smoke.sh

      - name: Run Scala concurrency smoke
        run: ./ci/scala_concurrent_smoke.sh

      - name: Run Scala annotation smoke
        run: ./ci/scala_annotation_smoke.sh

      - name: Run Scala runtime reflection smoke
        run: ./ci/scala_reflect_smoke.sh

      - name: Run Scala functional smoke
        run: ./ci/scala_functional_smoke.sh

      - name: Run Scala collection smoke
        run: ./ci/scala_collection_smoke.sh

      - name: Run Scala language smoke
        run: ./ci/scala_language_smoke.sh

      - name: Run Scala library smoke
        run: ./ci/scala_library_smoke.sh

      - name: Run Scala interop smoke
        run: ./ci/scala_interop_smoke.sh

      - name: Run Scala package smoke
        run: ./ci/scala_package_smoke.sh

      - name: Run Scala macro smoke
        run: ./ci/scala_macro_smoke.sh

      - name: Run Scala reflection-shape smoke
        run: ./ci/scala_reflection_shape_smoke.sh

      - name: Run Scala modern interop smoke
        run: ./ci/scala_modern_interop_smoke.sh

      - name: Run Scala duration smoke
        run: ./ci/scala_duration_smoke.sh

      - name: Run Scala StackWalker smoke
        run: ./ci/scala_stackwalker_smoke.sh

      - name: Run Scala compiler smoke
        run: ./ci/scala_smoke.sh
