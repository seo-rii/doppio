name: Modern Java

on:
  push:
  pull_request:

concurrency:
  group: modern-java-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime and Java 17 compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      runtime-artifact-name: ${{ steps.bundle_runtime.outputs.artifact_name }}
      runtime-archive-sha256: ${{ steps.bundle_runtime.outputs.sha256 }}
      runtime-run-id: ${{ steps.bundle_runtime.outputs.run_id }}
      runtime-run-attempt: ${{ steps.bundle_runtime.outputs.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          npm install -g yarn@1.22.22
          TRAVIS=true yarn install --frozen-lockfile --ignore-engines --network-timeout 600000

      - name: Check TypeScript compiler compatibility
        run: |
          ./node_modules/.bin/grunt bootstrap-typecheck --grunt-ignore-compile-errors
          yarn typecheck
          yarn typecheck:bootstrap
          yarn typecheck:typescript-7-rc
          yarn typecheck:typescript-7-rc-bootstrap

      - name: Check compiler smoke workflow coverage
        run: |
          yarn ci:check-modern-java-workflow:test
          yarn ci:check-modern-java-workflow
          yarn ci:check-compiler-bootstrap-consumers:test
          yarn ci:check-compiler-bootstrap-consumers
          yarn ci:check-kotlin-modern-source-guards:test
          yarn ci:check-kotlin-modern-source-guards
          yarn ci:check-scala-modern-source-guards:test
          yarn ci:check-scala-modern-source-guards

      - name: Check Pages smoke retry
        timeout-minutes: 1
        run: node ci/pages_browser_smoke_retry_test.mjs

      - name: Install Java compatibility Chromium
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Check Java compatibility baseline tooling
        timeout-minutes: 3
        run: node --test ci/prepare_java_compatibility_toolchains_test.mjs ci/run_java_compatibility_test.mjs ci/java_compatibility_browser_test.mjs

      - name: Check phase A inventory and evidence contracts
        timeout-minutes: 3
        run: node --test ci/plan_spec_source_index_test.mjs ci/check_java_se_api_census_test.mjs ci/java_se_contract_sources_test.mjs ci/check_plan_spec_obligations_test.mjs ci/check_phase_a_inventory_test.mjs ci/check_phase_a_evidence_test.mjs

      - name: Build release CLI runner
        timeout-minutes: 20
        run: ./node_modules/.bin/grunt --stack modern-ci-release-cli --grunt-ignore-compile-errors

      - name: Build Java compatibility browser runtime
        timeout-minutes: 10
        run: ./node_modules/.bin/grunt --stack make_build_dir:release vite-release listings:release --grunt-ignore-compile-errors

      - name: Verify compiler bootstrap overlay
        run: ./ci/modern_bootstrap_overlay_smoke.sh

      - name: Bundle deterministic compiler runtime inputs
        id: bundle_runtime
        run: >-
          node ci/modern_java_runtime_artifact.mjs create
          --output-dir build/ci-artifacts
          --manifest ci/modern_java_smoke_shards.json
          --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"

      - name: Check Mesa fixture scheduling
        timeout-minutes: 2
        run: node ci/mesa_test_regression_test.cjs

      - name: Check Wait fixture scheduling
        timeout-minutes: 2
        run: node ci/wait_test_regression_test.cjs

      - name: Run Java 17 legacy compatibility tests
        run: >-
          ./node_modules/.bin/grunt --stack
          check_jdk find_native_java run_java:default lineending:default
          unit_test:default unit_test_nashorn_legacy
          --grunt-ignore-compile-errors

      - name: Run modern Java compatibility tests
        run: ./node_modules/.bin/grunt --stack test-modern-java-runtime --grunt-ignore-compile-errors

      - name: Prepare pinned Java compatibility toolchains
        timeout-minutes: 25
        run: node ci/prepare_java_compatibility_toolchains.mjs

      - name: Verify complete phase A requirements inventory
        id: phase_a_inventory
        timeout-minutes: 30
        run: node ci/plan_spec_source_index.mjs --check && node ci/check_java_se_api_census.mjs && node ci/java_se_contract_sources.mjs && node ci/check_phase_a_inventory.mjs

      - name: Upload phase A requirements inventory
        if: always() && steps.phase_a_inventory.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: |
            build/phase-a-inventory.json
            build/phase-a-edition-deltas.json.gz
            build/java-se-api-census/*.gz
            build/java-se-api-census/summary.json
            build/java-se-contract-sources/*.gz
            build/java-se-contract-sources/summary.json
            build/java-se-contract-sources/documents/*.gz
          if-no-files-found: error
          retention-days: 7

      - name: Run genuine Java 21 and 25 seed fixtures
        id: java_compatibility
        timeout-minutes: 130
        run: node ci/run_java_compatibility.mjs --browser

      - name: Run final Java 25 launcher compatibility
        timeout-minutes: 40
        run: node ci/java25_main_test.mjs --browser

      - name: Check main exit status contracts
        timeout-minutes: 1
        run: node ci/jvm_exit_status_test.cjs && node --test ci/java_uncaught_exit_contract_test.mjs

      - name: Run Java uncaught-exception exit compatibility
        id: uncaught_exit
        timeout-minutes: 60
        run: node ci/java_uncaught_exit_test.mjs --browser

      - name: Upload Java uncaught-exception exit ledger
        if: always() && steps.uncaught_exit.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-uncaught-exit-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check class-file version admission
        timeout-minutes: 1
        run: node ci/class_file_version_test.cjs && node --test ci/java_class_version_test_test.mjs

      - name: Run Java class-file version compatibility
        id: class_version_admission
        timeout-minutes: 50
        run: node ci/java_class_version_test.mjs --browser

      - name: Upload class-file admission ledger
        if: always() && steps.class_version_admission.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-class-version-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Verify current-commit phase A execution evidence
        timeout-minutes: 1
        run: node ci/check_phase_a_evidence.mjs

      - name: Check phase B initialization contracts
        timeout-minutes: 1
        run: node --test ci/class_initialization_test.cjs ci/interface_invocation_initialization_test.cjs ci/java_initialization_contract_test.mjs

      - name: Run Java initialization compatibility
        id: java_initialization
        timeout-minutes: 10
        run: node ci/run_java_compatibility.mjs --manifest ci/java_initialization_manifest.json --output build/java-initialization-results.json --browser

      - name: Upload Java initialization ledger
        if: always() && steps.java_initialization.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-initialization-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B structural contracts
        timeout-minutes: 1
        run: node --test ci/class_member_structure_test.cjs ci/class_attribute_structure_test.cjs ci/java_class_structure_contract_test.mjs

      - name: Run Java class-file structural compatibility
        id: java_class_structure
        timeout-minutes: 15
        run: node ci/java_class_structure_test.mjs --browser

      - name: Upload Java class-file structural ledger
        if: always() && steps.java_class_structure.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-class-structure-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B bytecode verification contracts
        timeout-minutes: 3
        run: node --test ci/bytecode_structure_test.cjs ci/bytecode_type_test.cjs ci/verification_relations_test.cjs ci/verification_exception_boundary_test.cjs ci/class_verification_test.cjs ci/verification_loader_failure_test.cjs ci/class_verification_integration_test.cjs ci/modern_overlay_verification_test.cjs ci/unsafe_allocation_verification_test.cjs ci/reflection_invocation_verification_test.cjs ci/lambda_verification_test.cjs ci/reflection_adapters_test.cjs ci/java_bytecode_verification_contract_test.mjs

      - name: Run Java bytecode verification compatibility
        id: java_bytecode_verification
        timeout-minutes: 15
        run: node ci/java_bytecode_verification_test.mjs --browser

      - name: Upload Java bytecode verification ledger
        if: always() && steps.java_bytecode_verification.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-bytecode-verification-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B class derivation contracts
        timeout-minutes: 3
        run: node --test ci/class_derivation_test.cjs ci/class_loader_derivation_test.cjs ci/lookup_class_metadata_test.cjs ci/java_class_derivation_contract_test.mjs

      - name: Run Java class derivation compatibility
        id: java_class_derivation
        timeout-minutes: 15
        run: node ci/java_class_derivation_test.mjs --browser

      - name: Upload Java class derivation ledger
        if: always() && steps.java_class_derivation.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-class-derivation-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B loading constraint contracts
        timeout-minutes: 3
        run: node --test ci/loading_constraints_test.cjs ci/class_loading_constraints_test.cjs ci/member_loading_constraints_test.cjs ci/class_preparation_test.cjs ci/method_selection_test.cjs ci/java_loading_constraints_contract_test.mjs

      - name: Run Java loading constraint compatibility
        id: java_loading_constraints
        timeout-minutes: 15
        run: node ci/java_loading_constraints_test.mjs --browser

      - name: Upload Java loading constraint ledger
        if: always() && steps.java_loading_constraints.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-loading-constraints-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B member resolution contracts
        timeout-minutes: 3
        run: node --test ci/class_member_resolution_test.cjs ci/java_member_resolution_contract_test.mjs

      - name: Run Java member resolution compatibility
        id: java_member_resolution
        timeout-minutes: 20
        run: node ci/java_member_resolution_test.mjs --browser

      - name: Upload Java member resolution ledger
        if: always() && steps.java_member_resolution.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-member-resolution-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B member access contracts
        timeout-minutes: 3
        run: node --test ci/symbolic_resolution_test.cjs ci/class_access_test.cjs ci/java_member_access_contract_test.mjs

      - name: Run Java member access compatibility
        id: java_member_access
        timeout-minutes: 25
        run: node ci/java_member_access_test.mjs --browser

      - name: Upload Java member access ledger
        if: always() && steps.java_member_access.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-member-access-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B invocation evolution contracts
        timeout-minutes: 1
        run: node --test ci/method_selection_test.cjs ci/opcode_member_kind_test.cjs ci/java_invocation_evolution_contract_test.mjs

      # Six javac operations (60s each) plus six native/Node/Chromium executions
      # (120s each), with two minutes for integrity checks and final ledger writes.
      - name: Run Java invocation evolution compatibility
        id: java_invocation_evolution
        timeout-minutes: 20
        run: node ci/java_invocation_evolution_test.mjs --browser

      - name: Upload Java invocation evolution ledger
        if: always() && steps.java_invocation_evolution.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-invocation-evolution-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B core semantics contracts
        timeout-minutes: 3
        run: node --test ci/jvm_float_precision_test.cjs ci/jvm_float_to_long_test.cjs ci/array_store_semantics_test.cjs ci/athrow_semantics_test.cjs ci/nominal_constant_interfaces_test.cjs ci/java_core_bytecode_test.mjs ci/java_core_stack_forms_contract_test.mjs ci/java_core_semantics_contract_test.mjs

      # Twelve bounded javac operations (60s) and ten group/release executions
      # on native (30s), Node (60s) and Chromium (60s): 37 minutes plus eight
      # minutes for immutable input/bytecode checks and durable ledger writes.
      - name: Run Java core semantics compatibility
        id: java_core_semantics
        timeout-minutes: 45
        run: node ci/java_core_semantics_test.mjs --browser

      - name: Upload Java core semantics ledger
        if: always() && steps.java_core_semantics.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-core-semantics-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check phase B record semantics contracts
        timeout-minutes: 3
        run: node --test ci/record_component_native_test.cjs ci/annotated_wildcard_bounds_test.cjs ci/record_object_methods_test.cjs ci/java_record_semantics_contract_test.mjs

      # Ten bounded javac operations (60s) and six group/release executions
      # on native (30s), Node (60s) and Chromium (60s): 25 minutes plus five
      # minutes for immutable metadata checks and durable ledger writes.
      - name: Run Java record semantics compatibility
        id: java_record_semantics
        timeout-minutes: 30
        run: node ci/java_record_semantics_test.mjs --browser

      - name: Upload Java record semantics ledger
        if: always() && steps.java_record_semantics.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-record-semantics-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Check evolved switch ledger contract
        timeout-minutes: 1
        run: node --test ci/java_pattern_evolution_contract_test.mjs

      - name: Run evolved enum and sealed switch compatibility
        id: pattern_evolution
        timeout-minutes: 45
        run: node ci/java_pattern_evolution_test.mjs --browser

      - name: Upload evolved switch compatibility ledger
        if: always() && steps.pattern_evolution.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-pattern-evolution-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Java compatibility baseline ledger
        if: always() && steps.java_compatibility.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/java-compatibility-results.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Run core array compatibility smoke
        run: |
          ./node_modules/.bin/grunt --stack modern-ci-array-runout --grunt-ignore-compile-errors
          node build/release-cli/console/test_runner.js classes/test/ArrayOps --makefile

      - name: Verify compiler runtime input snapshot
        run: >-
          node ci/modern_java_runtime_artifact.mjs verify-source
          --archive "${{ steps.bundle_runtime.outputs.archive_path }}"
          --manifest ci/modern_java_smoke_shards.json
          --sha256 "${{ steps.bundle_runtime.outputs.sha256 }}"
          --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --artifact-name "${{ steps.bundle_runtime.outputs.artifact_name }}"

      # A raw deterministic tar preserves payload modes without trusting the
      # artifact transport to preserve permissions or symbolic links.
      - name: Upload compiler runtime inputs
        id: upload_runtime
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.bundle_runtime.outputs.archive_path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  compiler:
    name: Compiler smoke (${{ matrix.shard }})
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KOTLIN_SMOKE_CLASSPATH_MODE: full
    strategy:
      fail-fast: false
      matrix:
        shard: [compiler-01, compiler-02, compiler-03, compiler-04, compiler-05, compiler-06, compiler-07, compiler-08]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies without repository lifecycle scripts
        timeout-minutes: 15
        run: |
          npm install -g yarn@1.22.22
          TRAVIS=true yarn install --frozen-lockfile --ignore-engines --ignore-scripts --network-timeout 600000

      - name: Cache Kotlin compiler
        uses: actions/cache@v5
        with:
          path: build/kotlin-smoke-cache
          key: kotlin-compiler-${{ runner.os }}-${{ hashFiles('ci/modern_java_compiler_inputs.lock.json') }}

      - name: Cache Scala compiler
        uses: actions/cache@v5
        with:
          path: build/scala-smoke-cache
          key: scala-compiler-${{ runner.os }}-${{ hashFiles('ci/modern_java_compiler_inputs.lock.json') }}

      - name: Prepare verified compiler inputs
        run: >-
          node ci/prepare_modern_java_compiler_inputs.mjs
          --lock ci/modern_java_compiler_inputs.lock.json
          --kotlin-cache build/kotlin-smoke-cache
          --scala-cache build/scala-smoke-cache
          --marker build/modern-java-compiler-inputs.json

      - name: Download compiler runtime inputs
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.runtime.outputs.runtime-artifact-name }}
          path: build/ci-artifacts
          digest-mismatch: error

      - name: Verify and install compiler runtime inputs
        run: >-
          node ci/modern_java_runtime_artifact.mjs verify
          --archive "build/ci-artifacts/${{ needs.runtime.outputs.runtime-artifact-name }}"
          --manifest ci/modern_java_smoke_shards.json
          --sha256 "${{ needs.runtime.outputs.runtime-archive-sha256 }}"
          --commit "$GITHUB_SHA"
          --run-id "${{ needs.runtime.outputs.runtime-run-id }}"
          --run-attempt "${{ needs.runtime.outputs.runtime-run-attempt }}"
          --artifact-name "${{ needs.runtime.outputs.runtime-artifact-name }}"
          --extract-root .

      - name: Self-test transferred compiler runtime inputs
        run: node ci/modern_java_runtime_self_test.mjs

      - name: Run compiler smoke shard
        id: run_shard
        run: node ci/run_modern_java_smoke_shard.mjs "${{ matrix.shard }}"

      - name: Upload compiler smoke ledger
        if: always() && steps.run_shard.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          path: build/compiler-smoke-results/compiler-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}.json
          archive: false
          if-no-files-found: error
          retention-days: 7

  test:
    name: Modern Java release gate
    if: always()
    needs: [runtime, compiler]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all Modern Java jobs to pass
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          COMPILER_RESULT: ${{ needs.compiler.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$COMPILER_RESULT" = success
